services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: bridge
    ports:
      - "8096:8096"   # web UI
      - "8920:8920"   # optional HTTPS
    volumes:
      # Container config/cache on SSD
      - /drives/jellyfin:/config
      # Media libraries
      - /drives/anime/anime-shows:/media/anime-shows
      - /drives/anime/anime-movies:/media/anime-movies
      - /drives/atlantis/movies:/media/movies
      - /drives/atlantis/tv-shows:/media/tv-shows
      - /drives/atlantis/library:/media/library
      - /drives/atlantis/music:/media/music
      - /drives/atlantis/pictures:/media/pictures
    environment:
      - PUID=1000       # my Linux user id
      - PGID=1000       # my Linux group id
      - TZ=Europe/Amsterdam
    restart: unless-stopped
