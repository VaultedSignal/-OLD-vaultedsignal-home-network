services:
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/arcane-headless:latest
    container_name: prometheus-arcane-edge-agent
    restart: unless-stopped
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - AGENT_TOKEN=arc_aec5e2b2fe1f6cf8663dd47a36032c12572d98d1baa7201a2da9fe57fd75c616
      - MANAGER_API_URL=http://192.168.2.201:3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/arcanearcane-data:/app/data
volumes:
  arcane-data: