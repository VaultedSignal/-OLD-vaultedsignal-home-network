services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # CRUCIAL: Routes all traffic through the 'gluetun' container's network stack
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8080
    volumes:
      - /docker/qbittorrent/config:/config
      - /drives/theseed/downloads/incomplete:/incomplete # incomplete downloads are here
      - /drives/theseed/downloads/complete:/complete # complete downloads are here for the arr stack
      - /drives/theseed/torrents:/torrents # auto add torrents from this folder
#    depends_on:
#      gluetun:
#        condition: service_healthy
    restart: unless-stopped
