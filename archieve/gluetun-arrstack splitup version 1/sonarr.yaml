services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - PORT=8989 # need to specify the port cauze there is more then 1 instance in the compose
    volumes:
      - /docker/sonarr/config:/config
      - /drives/alfheim//tv-shows:/tv-shows
      - /drives/theseed/downloads/complete:/downloads/complete
    ports:
      - "8989:8989"
    restart: unless-stopped
    