services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /docker/sonarr/config:/config
      - /drives/alfheim//tv-shows:/tv-shows
      - /drives/theseed/downloads/complete:/downloads/complete
    ports:
      - 8989:8989
    restart: unless-stopped