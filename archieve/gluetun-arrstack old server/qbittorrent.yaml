services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8888
    volumes:
      - /docker/qbittorrent/config:/config
      - /drives/downloaddrive/incomplete:/downloads/incomplete # incomplete downloads are here
      - /drives/downloaddrive/complete:/downloads/complete # complete downloads are here for the arr stack
      - /drives/downloaddrive/torrents:/torrents # auto add torrents from this folder
    network_mode: container:gluetun  # run it through the VPN
    restart: unless-stopped
