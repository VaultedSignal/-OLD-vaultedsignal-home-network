services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /docker/kavita/config:/config
      - /kavita/data:/data #optional
      - /drives/alfheim/library:/alheim/library
    ports:
      - 5000:5000
    restart: unless-stopped